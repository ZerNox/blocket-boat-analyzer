# Blocket boat analyzer configuration.

[search]
# Any Blocket boat search URL; its filters are reused against the JSON search API.
# Cabin boats like a Sandström 560 MC: Hyttbåt + Kabinbåt + Daycruiser, 17-21 ft, 40-100 hp, private, <= 300 000 kr.
# The hp and length ranges are applied locally (Blocket's own range filters drop ads with the field left empty).
url = "https://www.blocket.se/mobility/search/boat?class=7962&class=6923&class=2184&dealer_segment=1&length_feet_from=17&length_feet_to=21&motor_size_from=40&motor_size_to=100&price_to=300000"
# Seconds between requests. Be polite: one sequential client, no parallelism.
delay_s = 1.2
# Where you'd collect the boat from: the site filters on straight-line distance (adjustable there).
home = { name = "Kungälv", postcode = "44242", lat = 57.871, lon = 11.98 }
max_km = 300
# Exact models similar to the target, searched by name in every boat type (catches misfiled ads).
# Only ads whose model family matches exactly are kept. Filters below apply to these searches.
models = [
  "Sandström 560", "Sandström 565",
  "Ryds 550", "Ryds 568", "Ryds 530", "Ryds Camping",
  "Uttern 5500", "Uttern 560", "Uttern 590",
  "Yamarin 56", "Yamarin 5800", "Yamarin 575",
  "Flipper 535", "Flipper 570", "Flipper 575", "Flipper 580",
  "Örnvik 530", "Örnvik 540", "Örnvik 550", "Örnvik 555", "Örnvik 575",
  "Bella 561", "Bella 572", "Crescent 535", "Grisslan 600", "Väddö 560", "Ideal 550",
]
model_filters = "dealer_segment=1&motor_size_from=40&motor_size_to=100&price_to=300000"
# Refetch an ad page when the search result says it was updated, or when older than this.
refetch_after_days = 7

[llm]
server_bin = "~/gpu-bench/llama.cpp/build/bin/llama-server"
model = "~/gpu-bench/qwen7b-q4km.gguf"  # Qwen2.5-7B-Instruct Q4_K_M
# Vulkan device indices change between boots; pick the device by name instead.
device_match = "Arc"
port = 8091
ctx = 8192
# Shared with the investor pipeline's Whisper job: only one GPU consumer at a time.
gpu_lock = "~/.local/state/investor/gpu.lock"
gpu_lock_timeout_s = 1800

# Last resort for ads whose text doesn't give the engine power: read the engine cowling in the photos.
[vision]
model = "~/models/qwen3-vl-8b/Qwen3VL-8B-Instruct-Q4_K_M.gguf"
mmproj = "~/models/qwen3-vl-8b/mmproj-Qwen3VL-8B-Instruct-Q8_0.gguf"
port = 8092
ctx = 16384
max_photos = 12

[ranking]
# Prices below this are placeholders ("0 kr", "1 kr", "bud").
min_price = 5000
outboard_only = true
# Score multiplier per red flag (renoveringsobjekt, defekt, läcker, ...).
red_flag_penalty = 0.20
ridge_lambda = 2.0
# Prior strength (in ads) for model-level price effects: a model with n ads gets weight n / (n + k).
model_prior = 4.0
# How many weighted direct comparables it takes to outweigh the make/type model (weight n / (n + k)).
comp_prior = 2.0
# Market ads the price model learns from: comparable motorboats, not sailboats, jet skis or yachts.
market_classes = ["Hyttbåt", "Kabinbåt", "Daycruiser", "Styrpulpetbåt", "Bowrider", "Fiskebåt/Arbetsbåt"]
market_length_ft = [14, 26]

# A newer engine than the hull is worth real money on an old boat (a 5-year-old 90 hp four-stroke
# is ~70 000 kr on its own). Value = (base + per_hp * hp) * (0.75 if two-stroke) * (1 - depreciation)^age,
# never below floor * new price. The fair price gets (this engine's value - value of an engine as old as the hull).
[engine_value]
base = 30000
per_hp = 1200
two_stroke_factor = 0.75
depreciation = 0.12
floor = 0.08

# Your buying profile: the site's defaults. At or under target_price counts as excellent.
[profile]
max_price = 200000
target_price = 120000
# Only boats whose ad states an engine year from this year on (estimates don't count).
min_engine_year = 2015

# Estimated used-market value (SEK) an included item adds to the deal.
# Subtracted from the asking price before comparing boats against each other.
[extras]
# Trailer: by speed class when stated (80 km/h registered road trailer vs 30 km/h "kärra"),
# depreciated per year of age when the trailer's year is stated.
trailer = 12000
trailer_80 = 20000
trailer_30 = 7000
trailer_depreciation_per_year = 0.04
plotter = 6000
ekolod = 2500
kapell = 4000
vinterkapell = 1500
elmotor = 5000
hjalpmotor = 3000
vhf = 1500
stereo = 1000
hydraulstyrning = 2000
landstrom = 1000
